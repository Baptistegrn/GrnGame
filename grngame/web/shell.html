<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>GrnGame for web</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            image-rendering: -moz-crisp-edges;
            outline: none;
        }
    </style>

    <script>
        var Module = {
            preRun: [
                function () {
                    FS.createPreloadedFile(
                        "/",
                        "Assets.pak",
                        "Assets.pak",
                        true,
                        false
                    );
                }
            ],

            canvas: (function () {
                return document.getElementById('canvas');
            })()
        };
    </script>
</head>

<body>
    -- lock right click
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>

    {{{ SCRIPT }}}
</body>

</html>
