name: Release

on:
  workflow_call:

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package artifacts per architecture
        shell: bash
        run: |
          mkdir -p release-assets

          PLATFORMS="linux-x64 linux-arm64 macos-x64 macos-arm64 windows-x64 windows-arm64"
          TAG="${GITHUB_REF_NAME}"

          for platform in $PLATFORMS; do
            STAGE_DIR="staging_${platform}"
            MODEL_DIR="${STAGE_DIR}/project_model"
            RUNTIME_DIR="${STAGE_DIR}/runtime"
            SCRIPT_DIR="${STAGE_DIR}/scripts"

            mkdir -p "${MODEL_DIR}/assets"
            mkdir -p "${MODEL_DIR}/data"
            mkdir -p "${MODEL_DIR}/config"
            mkdir -p "${RUNTIME_DIR}"
            mkdir -p "${SCRIPT_DIR}"

            cp ressources/config.json "${MODEL_DIR}/config/"
            cp grngame/input/gamecontrollerdb.txt "${MODEL_DIR}/data/"
            cp scripts/server.py "${MODEL_DIR}/"
            cp -r std "${MODEL_DIR}/std"

            if [[ "$platform" == *"windows"* ]]; then
              cp ressources/batch/setup.bat "${STAGE_DIR}/setup.bat"
              find ressources/batch -maxdepth 1 -type f ! -name "setup.bat" -exec cp {} "${SCRIPT_DIR}/" \;
            else
              cp ressources/bash/setup.sh "${STAGE_DIR}/setup.sh"
              chmod +x "${STAGE_DIR}/setup.sh"
              find ressources/bash -maxdepth 1 -type f ! -name "setup.sh" -exec cp {} "${SCRIPT_DIR}/" \;
              chmod +x "${SCRIPT_DIR}"/*.sh 2>/dev/null || true
            fi

            if [ -d "artifacts/${platform}-release-embedfalse" ]; then
              find "artifacts/${platform}-release-embedfalse" -type f \
                ! -name "*.lib" ! -name "*.exp" ! -name "*.pdb" ! -name "*.a" ! -name "*.ilk" \
                -exec cp {} "${MODEL_DIR}/" \;
            fi

            for rt_platform in $PLATFORMS; do
              RT_SRC_DIR="artifacts/${rt_platform}-release-embedtrue"
              if [ -d "${RT_SRC_DIR}" ]; then
                find "${RT_SRC_DIR}" -path "*/Runtime/*" -type f \
                  ! -name "*.lib" ! -name "*.exp" ! -name "*.pdb" ! -name "*.a" ! -name "*.ilk" \
                  -exec cp {} "${RUNTIME_DIR}/" \;
              fi
            done

            ARCHIVE_NAME="${platform}-${TAG}.zip"

            cd "${STAGE_DIR}"
            zip -r "../release-assets/${ARCHIVE_NAME}" .
            cd ..
            rm -rf "${STAGE_DIR}"
          done

          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/*.zip