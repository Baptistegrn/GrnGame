name: Release

on:
  workflow_call:

jobs:
  # first prepare every releases assets (zip)
  prepare_assets:
    name: Prepare staging folders and zips
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package zips and build staging
        run: python3 scripts/package_release.py "${{ github.ref_name }}"

      - name: Upload zips
        uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: release-assets/*.zip

      - name: Upload staging folders
        uses: actions/upload-artifact@v4
        with:
          name: staging-folders
          path: staging_*/**

  # create xpack and upload it
  build_xpack:
    name: XPack ${{ matrix.platform }}
    needs: prepare_assets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
          - platform: linux-arm64
            os: ubuntu-22.04-arm
          - platform: windows-x64
            os: windows-latest
          - platform: windows-arm64
            os: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Download Staging Folders
        uses: actions/download-artifact@v4
        with:
          name: staging-folders

      - name: Install WiX (Windows ARM)
        if: matrix.platform == 'windows-arm64'
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts debhelper dpkg-dev fakeroot
          which debuild

      - name: Run XPack
        run: python scripts/build_xpack.py "${{ github.ref_name }}"

      - name: Upload Native Packages
        uses: actions/upload-artifact@v4
        with:
          name: xpack-${{ matrix.platform }}
          path: release-assets/*

  # merge and push
  release:
    name: Create GitHub Release
    needs: build_xpack
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Zips
        uses: actions/download-artifact@v4
        with:
          name: release-zips
          path: release-assets/

      - name: Download Native Packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          pattern: xpack-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/*