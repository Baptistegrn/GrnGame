name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  # compilation
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, runner: ubuntu-22.04, platform: linux-x64, buildtype: release, embed: false }
          - { os: ubuntu-22.04, runner: ubuntu-22.04, platform: linux-x64, buildtype: release, embed: true }
          - { os: ubuntu-22.04-arm, runner: ubuntu-22.04-arm, platform: linux-arm64, buildtype: release, embed: false }
          - { os: ubuntu-22.04-arm, runner: ubuntu-22.04-arm, platform: linux-arm64, buildtype: release, embed: true }
          - { os: macos-latest, runner: macos-latest, platform: macos-arm64, buildtype: release, embed: false }
          - { os: macos-latest, runner: macos-latest, platform: macos-arm64, buildtype: release, embed: true }
          - { os: macos-15-intel, runner: macos-15-intel, platform: macos-x64, buildtype: release, embed: false }
          - { os: macos-15-intel, runner: macos-15-intel, platform: macos-x64, buildtype: release, embed: true }
          - { os: windows-latest, runner: windows-latest, platform: windows-x64, buildtype: release, embed: false }
          - { os: windows-latest, runner: windows-latest, platform: windows-x64, buildtype: release, embed: true }
          - { os: windows-11-arm, runner: windows-11-arm, platform: windows-arm64, buildtype: release, embed: false }
          - { os: windows-11-arm, runner: windows-11-arm, platform: windows-arm64, buildtype: release, embed: true }

    runs-on: ${{ matrix.runner }}
    name: "${{ matrix.platform }} | ${{ matrix.buildtype }} | embed=${{ matrix.embed }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: '.xmake-cache-v2'
          package-cache: false
          build-cache: true

      - name: Remove homebrew freetype
        if: runner.os == 'macOS'
        run: brew uninstall --ignore-dependencies freetype

      - name: Configure
        run: >
          xmake config --clean
          -m ${{ matrix.buildtype }}
          -y -vv
          --embed_assets=${{ matrix.embed }}

      - name: Build
        run: xmake build -y -vv

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.platform }}-${{ matrix.buildtype }}-embed${{ matrix.embed }}"
          path: |
            build/Embedded/
            build/Runtime/

  # compilation wasm
  build-wasm:
    runs-on: ubuntu-22.04
    name: "wasm | release | embed=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: '.xmake-cache-v2'
          package-cache: false
          build-cache: true

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14

      - name: Configure
        run: >
          xmake f -p wasm -c
          -y -vv
          --embed_assets=y

      - name: Build
        run: xmake build -y -vv

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "wasm-release-embedtrue"
          path: build/Runtime/

  # creation of the release
  release:
    name: Create GitHub Release
    needs: [build, build-wasm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package artifacts per architecture
        shell: bash
        run: |
          mkdir -p release-assets

          PLATFORMS="linux-x64 linux-arm64 macos-x64 macos-arm64 windows-x64 windows-arm64"
          TAG="${GITHUB_REF_NAME}"

          for platform in $PLATFORMS; do
            STAGE_DIR="staging_${platform}"
            MODEL_DIR="${STAGE_DIR}/project_model"
            RUNTIME_DIR="${MODEL_DIR}/runtime"

            mkdir -p "${MODEL_DIR}/assets"
            mkdir -p "${MODEL_DIR}/scripts"
            mkdir -p "${MODEL_DIR}/data"
            mkdir -p "${MODEL_DIR}/config"
            mkdir -p "${RUNTIME_DIR}"

            cp ressources/config.json "${MODEL_DIR}/config/"
            cp grngame/input/gamecontrollerdb.txt "${MODEL_DIR}/data/"
            cp scripts/server.py "${MODEL_DIR}/"
            cp -r std "${MODEL_DIR}/std"

            if [ -d "artifacts/wasm-release-embedtrue" ]; then
              cp -r artifacts/wasm-release-embedtrue/* "${MODEL_DIR}/"
              find "${MODEL_DIR}" -name "*.a" -type f -delete
            fi

            if [[ "$platform" == *"windows"* ]]; then
              cp ressources/batch/project.bat "${STAGE_DIR}/project.bat"
              cp ressources/batch/* "${MODEL_DIR}/" 2>/dev/null || true
              rm -f "${MODEL_DIR}/project.bat"
            else
              cp ressources/bash/project.sh "${STAGE_DIR}/project.sh"
              chmod +x "${STAGE_DIR}/project.sh"
              cp ressources/bash/* "${MODEL_DIR}/" 2>/dev/null || true
              rm -f "${MODEL_DIR}/project.sh"
              chmod +x "${MODEL_DIR}"/*.sh 2>/dev/null || true
            fi

            if [ -d "artifacts/${platform}-release-embedfalse" ]; then
              find "artifacts/${platform}-release-embedfalse" -type f \
                ! -name "*.lib" ! -name "*.exp" ! -name "*.pdb" ! -name "*.a" ! -name "*.ilk" \
                -exec cp {} "${MODEL_DIR}/" \;
            fi

            for rt_platform in $PLATFORMS; do
              RT_SRC_DIR="artifacts/${rt_platform}-release-embedtrue"
              if [ -d "${RT_SRC_DIR}" ]; then
                find "${RT_SRC_DIR}" -type f \
                  ! -name "*.lib" ! -name "*.exp" ! -name "*.pdb" ! -name "*.a" ! -name "*.ilk" \
                  -exec cp {} "${RUNTIME_DIR}/" \;
              fi
            done

            ARCHIVE_NAME="${platform}-${TAG}.zip"

            cd "${STAGE_DIR}"
            zip -r "../release-assets/${ARCHIVE_NAME}" .
            cd ..
            rm -rf "${STAGE_DIR}"
          done

          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/*.zip
