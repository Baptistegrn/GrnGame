name: Build android

on:
  workflow_call:

jobs:
  build-android:
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]

    runs-on: ubuntu-22.04
    name: "android-${{ matrix.abi }} / release"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: '.xmake-cache-android-${{ matrix.abi }}'
          package-cache: true
          build-cache: true

      #ndk is already installed 
      - name: Configure
        run: >
          xmake f -p android -a ${{ matrix.abi }} -m release -c
          --ndk="$ANDROID_NDK_LATEST_HOME"
          --embed_assets=y
          -y -vv

      - name: Build
        run: xmake build -y -vv

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "android-${{ matrix.abi }}-release"
          path: build/Runtime/libGrnGame.so
          if-no-files-found: error