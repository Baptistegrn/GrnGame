name: tests

on:
  workflow_call:

jobs:
  auto-tests:
    runs-on: ubuntu-22.04
    name: "auto tests / linux-x64 / embedded = false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: '.xmake-cache-tests-linux-x64'
          package-cache: true
          build-cache: true

      - name: Install virtual display / renderer / audio
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1-mesa-dri libglx-mesa0 libegl1 libgles2 mesa-vulkan-drivers \
            pulseaudio pulseaudio-utils alsa-utils libasound2-plugins

      - name: Start virtual audio device
        run: |
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/xdg"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1 --daemonize=yes
          pactl load-module module-null-sink sink_name=virtual_sink \
            sink_properties=device.description=VirtualSink
          pactl set-default-sink virtual_sink
          pactl info
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          xmake config --clean
          -m release
          -y -vv
          --embed_assets=false

      - name: Run auto tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: "4.5"
          MESA_GLSL_VERSION_OVERRIDE: "450"
        run: xvfb-run -a -s "-screen 0 1280x720x24" xmake run auto_tests -vv