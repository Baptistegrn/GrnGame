name: Build desktop

on:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, runner: ubuntu-22.04, platform: linux-x64, buildtype: release, embed: false }
          - { os: ubuntu-22.04, runner: ubuntu-22.04, platform: linux-x64, buildtype: release, embed: true }
          - { os: ubuntu-22.04-arm, runner: ubuntu-22.04-arm, platform: linux-arm64, buildtype: release, embed: false }
          - { os: ubuntu-22.04-arm, runner: ubuntu-22.04-arm, platform: linux-arm64, buildtype: release, embed: true }
          - { os: macos-latest, runner: macos-latest, platform: macos-arm64, buildtype: release, embed: false }
          - { os: macos-latest, runner: macos-latest, platform: macos-arm64, buildtype: release, embed: true }
          - { os: macos-15-intel, runner: macos-15-intel, platform: macos-x64, buildtype: release, embed: false }
          - { os: macos-15-intel, runner: macos-15-intel, platform: macos-x64, buildtype: release, embed: true }
          - { os: windows-latest, runner: windows-latest, platform: windows-x64, buildtype: release, embed: false }
          - { os: windows-latest, runner: windows-latest, platform: windows-x64, buildtype: release, embed: true }
          - { os: windows-11-arm, runner: windows-11-arm, platform: windows-arm64, buildtype: release, embed: false }
          - { os: windows-11-arm, runner: windows-11-arm, platform: windows-arm64, buildtype: release, embed: true }

    runs-on: ${{ matrix.runner }}
    name: "${{ matrix.platform }} / ${{ matrix.buildtype }} / embedded = ${{ matrix.embed }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: '.xmake-cache-${{ matrix.platform }}-embed-${{ matrix.embed }}'
          package-cache: true
          build-cache: true
      #freetype is not static on macos when its on the system
      - name: Remove homebrew freetype
        if: runner.os == 'macOS'
        run: brew uninstall --ignore-dependencies freetype

      - name: Configure
        run: >
          xmake config --clean
          -m ${{ matrix.buildtype }}
          -y -vv
          --embed_assets=${{ matrix.embed }}

      - name: Build
        run: xmake build -y -vv

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.platform }}-${{ matrix.buildtype }}-embed${{ matrix.embed }}"
          path: |
            build/Embedded/
            build/Runtime/