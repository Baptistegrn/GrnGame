name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  format:
    name: Format check
    uses: ./.github/workflows/format.yml

  build:
    name: Build desktop
    uses: ./.github/workflows/build-desktop.yml

  build-web:
    name: Build web
    uses: ./.github/workflows/build-web.yml

  dynamic:
    name: Dynamic libs check
    needs: [build]
    uses: ./.github/workflows/dynamic-libs.yml

  release:
    name: Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml

  tests:
    name: tests
    needs: [build]
    permissions:
      contents: write
    uses: ./.github/workflows/tests.yml