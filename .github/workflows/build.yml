name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  format:
    name: Format check
    uses: ./.github/workflows/format.yml

  build:
    name: Build desktop
    uses: ./.github/workflows/build-desktop.yml

  build-web:
    name: Build web
    uses: ./.github/workflows/build-web.yml

  build-android:
    name: Build android
    uses: ./.github/workflows/build-android.yml

  # tests:
  #   name: tests
  #   permissions:
  #     contents: write
  #   uses: ./.github/workflows/tests.yml

  dynamic:
    name: Dynamic libs check
    needs: [build]
    uses: ./.github/workflows/dynamic-libs.yml

  release:
    name: Release
    needs: [build, build-web, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml